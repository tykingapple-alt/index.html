<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Admin Shadowing Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. Brand bar, tabs, content. Stacks to one column on phones. */
:root{
  --bg:#F4F7F8; --surface:#FFFFFF; --surface-2:#EBF0F2; --fg:#172229; --muted:#5A6B74; --line:#D5DDE2;
  --accent:#0E7470; --accent-fg:#FFFFFF; --accent-soft:#DBEEEB;
  --warn:#9A6207; --warn-soft:#F7E8CB; --bad:#AE3838; --bad-soft:#F5DDDD; --good:#2A7A4A; --good-soft:#DAEFE1;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px; --shadow:0 1px 2px rgba(23,34,41,.06),0 4px 14px rgba(23,34,41,.05);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0F161A; --surface:#172229; --surface-2:#1F2C34; --fg:#E7EDF0; --muted:#9AAAB3; --line:#2B3A43;
  --accent:#42B5AE; --accent-fg:#06211F; --accent-soft:#163C39;
  --warn:#E2AB4A; --warn-soft:#3A2E14; --bad:#E27A7A; --bad-soft:#3D2020; --good:#64C48B; --good-soft:#173B27;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F161A; --surface:#172229; --surface-2:#1F2C34; --fg:#E7EDF0; --muted:#9AAAB3; --line:#2B3A43;
  --accent:#42B5AE; --accent-fg:#06211F; --accent-soft:#163C39;
  --warn:#E2AB4A; --warn-soft:#3A2E14; --bad:#E27A7A; --bad-soft:#3D2020; --good:#64C48B; --good-soft:#173B27;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1140px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:26px;font-weight:600}
h2{font-size:20px;font-weight:600}
h3{font-size:16px;font-weight:600}
h4{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}
.fine{font-size:13px;color:var(--muted)}
.mono{font-family:var(--mono);font-size:13px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand .name{display:flex;align-items:baseline;gap:10px}
.brand .name .k{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.02em}
.brand .name .sep{color:var(--line)}
.brand .name .sub{font-size:13px;color:var(--muted)}
.brand .signed{font-size:13px;color:var(--muted)}

.subnav{display:flex;gap:4px;flex-wrap:wrap;margin-top:14px;border-bottom:1px solid var(--line)}
.subnav button{border:0;background:transparent;color:var(--muted);padding:8px 12px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.subnav button.on{color:var(--fg);border-bottom-color:var(--accent)}
.subnav button .pill{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:11px;font-weight:700;margin-left:4px;text-align:center}

.content{display:flex;flex-direction:column;gap:16px;margin-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.soft{background:var(--surface-2);border-color:transparent}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tile .v{font-family:var(--display);font-size:28px;font-weight:600;line-height:1}
.tile .l{font-size:12.5px;color:var(--muted);margin-top:6px}
.tile.warn{border-color:var(--warn)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.item{padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0;padding-top:0}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:7px;font-weight:600;font-size:14px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent);padding:0;font-weight:600}
.link.sm{font-size:13px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.backlink{border:0;background:none;color:var(--accent);font-weight:600;padding:0;display:inline-flex;gap:4px;align-items:center}

/* Info tooltips */
.info{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--surface-2);color:var(--muted);font-size:10.5px;font-weight:700;font-family:var(--mono);cursor:help;vertical-align:middle;margin-left:5px;border:1px solid var(--line);user-select:none}
.info:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
#tip{position:fixed;z-index:40;max-width:260px;background:var(--fg);color:var(--bg);font-size:12.5px;line-height:1.4;padding:8px 10px;border-radius:6px;box-shadow:var(--shadow);pointer-events:none}
#tip[hidden]{display:none}

.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.checks li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
.checks .mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.checks .ok .mark{background:var(--good-soft);color:var(--good);border-color:transparent}
.checks .t{font-weight:600}
.checks .d{font-size:13px;color:var(--muted)}

.doc{display:flex;flex-direction:column;gap:10px}
.doc .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.doc .spec{color:var(--accent);font-weight:600;font-size:13px}
.doc .site{font-size:13.5px;color:var(--muted)}
.doc .rule{font-size:13.5px}
.doc .reqs{display:flex;gap:6px;flex-wrap:wrap}
.doc .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.doc .next{font-size:13px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;flex:none;overflow:hidden;position:relative}
.avatar.lg{width:72px;height:72px;font-size:24px}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.edit{cursor:pointer;border:0;padding:0}
.avatar.edit .ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);color:#fff;font-size:11px;font-weight:600;font-family:var(--body);opacity:0;transition:opacity .15s;text-align:center;line-height:1.2}
.avatar.edit:hover .ov,.avatar.edit:focus-visible .ov{opacity:1}

.months{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface);text-align:left;width:100%}
.slot:hover:not(:disabled){border-color:var(--accent)}
.slot:disabled{cursor:not-allowed;color:var(--muted);background:var(--surface-2)}
.slot .d{font-weight:600}
.slot .s{font-size:12.5px;color:var(--muted)}
.slot .w{flex-basis:100%;font-size:12px;color:var(--muted);margin-top:-2px}
.slot{flex-wrap:wrap}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.row{flex-direction:row;gap:10px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);width:100%}
.field input[type=checkbox],.field input[type=radio],.filters input[type=checkbox]{width:auto;min-width:0;padding:0;flex:0 0 auto}
.field textarea{min-height:72px;resize:vertical}
.field.full,.form .full{grid-column:1/-1}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
legend{font-family:var(--display);font-weight:600;font-size:15px;margin-bottom:6px;padding:0}
.opt{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.opt input{margin-top:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);color:var(--muted);padding:7px 12px;font-weight:600;font-size:13px}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.upload{border:1px dashed var(--line);border-radius:7px;padding:14px;text-align:center;color:var(--muted);font-size:13px}
.codebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.codebox code{font-family:var(--mono);font-size:18px;letter-spacing:.06em;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}

.tw{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.wrap-ok{white-space:normal}
tr:last-child td{border-bottom:0}
td.heat{font-weight:600}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--fg)}
th.sortable.on{color:var(--fg)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.filters input{min-width:160px}
.field.narrow{max-width:200px}
.field.narrow input{width:110px}
.settings{display:flex;flex-direction:column;gap:16px}
.settings .card{padding:22px}
.settings h3{margin-bottom:4px}

.mail{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.mail .mh{background:var(--surface-2);padding:10px 14px;font-size:13px;display:grid;gap:2px}
.mail .mh b{font-weight:600}
.mail .mb{padding:14px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.mail .mb .big{font-family:var(--display);font-size:17px;font-weight:600}
.mail .mf{padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.mail.done{opacity:.7}

.notice{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:7px;background:var(--accent-soft);color:var(--fg);font-size:13.5px}
.notice.warn{background:var(--warn-soft)}
.notice.bad{background:var(--bad-soft)}
.notice.good{background:var(--good-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px);z-index:20;transition:opacity .2s}
.toast[hidden]{display:none}

/* Profile */
.pnav{display:flex;gap:4px;flex-wrap:wrap}
.pnav a{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;padding:4px 8px;border-radius:6px;background:var(--surface-2)}
.phead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.act{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:13.5px}
.act .w{color:var(--muted);white-space:nowrap}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.cal .day{min-height:76px;border:1px solid var(--line);border-radius:6px;padding:4px;display:flex;flex-direction:column;gap:3px;background:var(--surface);min-width:0}
.cal .day.off{background:var(--surface-2);border-color:transparent}
.cal .day.today{border-color:var(--accent)}
.cal .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal .ev{font-size:11px;line-height:1.25;padding:2px 5px;border-radius:4px;border:0;text-align:left;width:100%;background:var(--accent-soft);color:var(--accent);font-weight:600;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .ev.booked{background:var(--good-soft);color:var(--good)}
.cal .ev.req{background:var(--warn-soft);color:var(--warn)}
.cal .ev.sel{box-shadow:0 0 0 2px var(--accent)}
@media (max-width:640px){ .cal .day{min-height:56px} .cal .ev{font-size:10px;padding:1px 3px} }

.funnel{display:grid;grid-template-columns:max-content 1fr max-content;gap:6px 10px;align-items:center;font-size:13.5px}
.funnel .bar{height:18px;background:var(--accent);border-radius:3px;opacity:.85}
.funnel .lab{color:var(--muted)}
.confirm{max-width:560px}
.hub{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.hub a.card{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--fg)}
.hub a.card:hover{border-color:var(--accent)}

@media (max-width:640px){ h1{font-size:22px} }
@media (prefers-reduced-motion:reduce){ .toast,.avatar.edit .ov{transition:none} }
tr.actrow td{background:var(--surface-2);white-space:normal;padding:10px 14px}
.actions{display:flex;flex-direction:column;gap:8px}
.action{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:7px}

.menuwrap{position:relative}
.popover{position:absolute;right:0;top:calc(100% + 8px);width:min(460px,calc(100vw - 32px));max-height:min(72vh,680px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,.16);z-index:40;padding:18px;text-align:left}
.popover .kv{font-size:13px}
.popover .form{grid-template-columns:1fr}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.38);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;width:100%;max-width:440px;box-shadow:0 18px 48px rgba(0,0,0,.22)}
.modal h3{margin:0}
.modal p{margin:0}

.viewseg{display:flex;width:100%;max-width:520px}
.viewseg button{flex:1;padding:8px 12px;font-weight:600}
.avlist{display:flex;flex-direction:column;gap:10px}
.avmonth{margin:8px 0 0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.avcard{display:grid;grid-template-columns:150px 1fr auto;gap:14px;align-items:center;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:14px 16px;width:100%}
.avcard:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.avcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.avcard .when{display:flex;flex-direction:column}
.avcard .who{display:flex;gap:10px;align-items:center;min-width:0}
.avcard .txt{min-width:0}
.avcard .name{font-weight:600}
.avcard .arrow{font-size:26px;line-height:1;color:var(--muted);padding:0 4px}
@media (max-width:640px){.avcard{grid-template-columns:1fr auto}.avcard .who{grid-column:1/-1}.avcard .arrow{grid-row:1;grid-column:2}}

.sechead{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:0;background:none;padding:0;margin:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.sechead h3{margin:0}
.sechead .fine{margin-top:4px}
.sechead .chev{font-size:18px;color:var(--muted);transition:transform .15s;flex:0 0 auto}
.sechead[aria-expanded="true"] .chev{transform:rotate(180deg)}
.settings .card.collapsed{padding:16px 22px}

/* Onboarding step indicator */
.steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.steps .st{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.steps .st .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-size:12px}
.steps .st.on{color:var(--fg)} .steps .st.on .n{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.steps .st.done .n{background:var(--good-soft);color:var(--good);border-color:transparent}
.steps .sep{flex:1;height:1px;background:var(--line);min-width:12px}

/* Visit and action cards (physician portal) */
.vcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.vcard{display:flex;flex-direction:column;gap:8px;padding:14px 16px}
.vcard .when{font-weight:600;font-size:15px;line-height:1.3}
.vcard .when .fine{font-weight:400;margin-top:2px}
.vcard .meta{font-size:12.5px;color:var(--muted);line-height:1.5}
.vcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap}
.card.collapsed{padding:16px 22px}

/* Setup checklist */
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--fg);border-radius:3px}
.checks{display:flex;flex-direction:column;gap:10px}
.check{display:flex;align-items:flex-start;gap:10px}
.check .dot{width:20px;height:20px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:12px;background:var(--line);color:transparent;margin-top:1px}
.check.done .dot{background:var(--good-soft);color:var(--good);border:1px solid var(--good)}
.check>div{flex:1}

function setFilter(path, value) { const [t, k] = path.split('.'); ui.f[t][k] = value; }
document.getElementById('subnav').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; ui.av = b.dataset.view; ui.profile = null; ui.summary = false; render(); });
document.getElementById('app').addEventListener('click', e => {
  const th = e.target.closest('th.sortable'); if (th) { const t = th.dataset.table, k = th.dataset.sortcol; const s = ui.sort[t]; ui.sort[t] = s && s.key === k ? { key: k, dir: -s.dir } : { key: k, dir: 1 }; render(); return; }
  if (e.target.closest('.info')) return;
  const el = e.target.closest('[data-action]'); if (!el) return;
  if (el.tagName === 'INPUT' || el.tagName === 'FORM' || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA' || el.tagName === 'LABEL') return;
  const a = el.dataset.action, id = el.dataset.id;
  if (ui.profile && (a === 'pauseForm' || a === 'resume' || a === 'docTab' || a.startsWith('cal')) && profileClick(a, el, doc(ui.profile), 'Admin')) { render(); return; }
  switch (a) {
    case 'profile': ui.profile = id; PUI.calSel = null; PUI.adminTab = 'profile'; break;
    case 'physView': ui.physView = el.dataset.view; break;
    case 'adminProfileClose': ui.profile = null; break;
    case 'approve': { const d = doc(id); d.status = 'active'; d.renewed = currentTerm().name; logActivity(d, 'Admin', 'Profile approved'); toast(d.name + ' is now active.'); break; }
    case 'pauseDoc': pauseDialog(doc(id), 'Admin'); return;
    case 'resumeDoc': { const d = doc(id); d.status = 'active'; d.pausedUntil = null; logActivity(d, 'Admin', 'Resumed'); toast(first(d.name) + ' is active.'); break; }
    case 'adminCancel': { const b = DB.bookings.find(x => x.id === id); confirmAction('Cancel this visit?', esc(stu(b.studentId).name) + ' with ' + esc(doc(b.doctorId).name) + ' on ' + fmtLong(b.date) + '. Both will be emailed and the date reopens.', 'Cancel visit', () => { cancelBooking(b, 'admin'); toast('Cancelled. Both sides notified.'); }); return; }
    case 'reinstate': { const s = stu(id); ui.menu = null; s.blockedAt = null; s.reinstatedAt = TODAY_ISO; toast(s.name + ' can book again.'); break; }
    case 'accessApprove': { const s = stu(id); ui.menu = null; s.activated = TODAY_ISO; s.elig = { status: 'approved', method: 'manual', on: TODAY_ISO, expires: CFG.codeExpires, by: CFG.sponsor }; toast(s.name + ' approved. They have been emailed.'); break; }
    case 'accessDeny': { const s = stu(id); confirmAction('Deny access for ' + s.name + '?', 'They will be emailed that their request was not approved and can ask again later.', 'Deny', () => { ui.menu = null; s.elig = { status: 'denied', method: 'manual', on: TODAY_ISO, by: CFG.sponsor }; toast('Denied. ' + s.name + ' has been emailed.'); }); return; }
    case 'revoke': { const s = stu(id); confirmAction('Revoke eligibility for ' + s.name + '?', 'They lose booking access until they verify again. Upcoming visits are not cancelled.', 'Revoke', () => { ui.menu = null; s.activated = null; s.elig = { status: 'revoked', method: (s.elig || {}).method, on: TODAY_ISO, by: CFG.sponsor }; toast(s.name + "'s activation revoked."); }); return; }
    case 'menu': ui.menu = ui.menu === id ? null : id; break;
    case 'graduate': { const s = stu(id); confirmAction('Mark ' + s.name + ' as graduated?', 'Booking closes today. Their history and export stay available, and this can be undone.', 'Mark graduated', () => { ui.menu = null; s.graduated = TODAY_ISO; toast(s.name + ' marked graduated. Booking closed; history stays.'); }, false); return; }
    case 'ungraduate': { const s = stu(id); ui.menu = null; s.graduated = null; toast(s.name + ' can book again.'); break; }
    case 'capGrant': { const c = DB.capRequests.find(x => x.id === id); ui.menu = null; const sel = document.getElementById('cap-' + id); c.extra = Number(sel ? sel.value : 1); c.status = 'granted'; c.decidedAt = TODAY_ISO; toast(stu(c.studentId).name + ' granted ' + c.extra + ' extra visit' + (c.extra > 1 ? 's' : '') + '. Emailed.'); break; }
    case 'capDeny': { const c = DB.capRequests.find(x => x.id === id); confirmAction('Deny this request?', esc(stu(c.studentId).name) + ' will be emailed that no extra visits were granted for ' + monthName(c.month) + '.', 'Deny', () => { ui.menu = null; c.status = 'denied'; c.decidedAt = TODAY_ISO; toast('Denied. ' + stu(c.studentId).name + ' has been emailed.'); }); return; }
    case 'summary': ui.summary = true; break;
    case 'expand': ui.open[el.dataset.sec] = !ui.open[el.dataset.sec]; break;
    case 'summaryClose': ui.summary = false; break;
    case 'copyCode': copyText(CFG.code, document.getElementById('codeVal')); return;
    case 'copyIntake': copyText(CFG.intakeUrl, document.getElementById('intakeVal')); return;
    case 'genCode': confirmAction('Generate a new activation code?', 'The current code stops working at once. Students who already activated are unaffected.', 'Generate', () => { const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const r = n => Array.from({ length: n }, () => chars[Math.floor(Math.random() * chars.length)]).join(''); CFG.code = 'W27-' + r(4) + '-' + r(3); CFG.codeExpires = nextTerm() ? nextTerm().end : '2027-04-30'; toast('New code generated. The old code no longer works.'); }); return;
    case 'allowDel': { const em = el.dataset.email; const a = CFG.allowlist.find(x => x.email === em); if (a && a.role === 'lead' && CFG.allowlist.filter(x => x.role === 'lead' && x.status === 'active').length <= 1) { toast('The last Lead Administrator cannot be removed.'); return; } confirmAction('Remove ' + em + '?', 'They lose access to this dashboard at once.', 'Remove admin', () => { CFG.allowlist = CFG.allowlist.filter(x => x.email !== em); toast('Removed.'); }); return; }
    case 'logoRemove': CFG.logo = ''; toast('Logo removed.'); break;
    case 'billingContact': stepUp('Change the billing contact', 'Invoices and payment notices go to this address.', 'Continue', () => toast('Enter the new address on the next screen.')); return;
    case 'exportPkg': stepUp('Export ' + el.dataset.name.toLowerCase() + '?', 'The export is emailed to you as a download link that works for 24 hours. Reflections are never included.', 'Export', () => toast(el.dataset.name + ' export started. Watch your email.')); return;
    case 'termDel': { const t = termById(id); confirmAction('Remove ' + (t ? t.name : 'this term') + '?', 'Bookings in its window will count toward the term before it.', 'Remove term', () => { CFG.terms = CFG.terms.filter(x => x.id !== id); toast('Term removed.'); }); return; }
    case 'togglePast': ui.showPastTerms = !ui.showPastTerms; break;
    case 'secToggle': ui.secOpen[el.dataset.sec] = !ui.secOpen[el.dataset.sec]; break;
    case 'toast': toast(el.dataset.msg); return;
    default: return;
  }
  render();
});
document.getElementById('app').addEventListener('input', e => {
  const el = e.target; if (!el.dataset.filter || el.tagName !== 'INPUT') return;
  setFilter(el.dataset.filter, el.value); const id = el.id; render(); const n = document.getElementById(id); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
});
document.getElementById('app').addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.filter && el.tagName === 'SELECT') { setFilter(el.dataset.filter, el.value); render(); return; }
  if (el.dataset.digest) { const a = CFG.allowlist.find(x => x.email === el.dataset.digest); if (a) a.digest = el.value; toast(el.value === 'None' ? 'Digest turned off for ' + el.dataset.digest + '.' : 'Digest day saved.'); if (el.dataset.digest === CFG.sponsorEmail) render(); return; }
  if (el.dataset.term) { const t = CFG.terms.find(x => x.id === el.dataset.term); if (t) t[el.dataset.tfield] = el.value; toast('Saved.'); return; }
  if (el.dataset.action === 'logoFile') { const file = el.files && el.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => { CFG.logo = r.result; toast('Logo updated.'); render(); }; r.readAsDataURL(file); return; }
  if (el.dataset.role) { const a = CFG.allowlist.find(x => x.email === el.dataset.role); if (!a) return; const to = el.value; if (to === 'lead') { stepUp('Make ' + (a.name || a.email) + ' a lead administrator?', 'Lead Administrators control billing, exports and every other administrator.', 'Confirm', () => { a.role = 'lead'; a.perms = []; toast(a.email + ' is now a Lead Administrator. They have been emailed.'); render(); }); el.value = a.role; return; }
    if (a.role === 'lead' && CFG.allowlist.filter(x => x.role === 'lead' && x.status === 'active').length <= 1) { toast('The last Lead Administrator cannot be demoted.'); el.value = 'lead'; return; } a.role = 'admin'; a.perms = ['physicians', 'students', 'bookings', 'analytics']; toast(a.email + ' is now an Organization Administrator. They have been emailed.'); render(); return; }
  if (el.dataset.perm) { const a = CFG.allowlist.find(x => x.email === el.dataset.perm); if (!a) return; a.perms = el.checked ? [...new Set([...a.perms, el.value])] : a.perms.filter(x => x !== el.value); toast('Permissions saved. ' + a.email + ' has been emailed.'); return; }
  if (el.dataset.alert) { const meA = CFG.allowlist.find(x => x.email === CFG.sponsorEmail); meA.alerts = el.checked ? [...new Set([...meA.alerts, el.dataset.alert])] : meA.alerts.filter(x => x !== el.dataset.alert); toast('Saved.'); return; }
  if (el.dataset.cfg) { const k = el.dataset.cfg; CFG[k] = el.type === 'number' ? Number(el.value) : el.type === 'checkbox' ? el.checked : el.value; toast('Saved.'); if (['gradAccess', 'accent', 'org'].includes(k)) render(); }
});
document.getElementById('app').addEventListener('submit', e => {
  e.preventDefault(); const f = e.target; const a = f.dataset.action; const v = i => { const x = document.getElementById(i); return x ? x.value.trim() : ''; };
  if (a === 'allowAdd') { const em = v('newAdmin'); if (!em) return; if (!em.endsWith('@' + CFG.domain)) { toast('Admins must use an @' + CFG.domain + ' address.'); return; } const role = v('newRole') || 'admin'; const perms = Array.from(f.querySelectorAll('input[name="newPerm"]:checked')).map(x => x.value); const adviser = !!(document.getElementById('newAdviser') || {}).checked;
    const add = () => { CFG.allowlist.push({ email: em, name: '', role, adviser, perms: role === 'lead' ? [] : perms, status: 'invited', since: TODAY_ISO, digest: 'Monday', alerts: [] }); render(); toast('Invitation sent to ' + em + '.'); };
    if (role === 'lead') stepUp('Invite a Lead Administrator?', 'Lead Administrators control billing, exports and every other administrator.', 'Send invitation', add); else add(); return; }
  if (a === 'termAdd') { const n = v('tn'), s = v('ts'), en = v('te'); if (!n || !s || !en) { toast('Name, start and end are all needed.'); return; } CFG.terms.push({ id: nid('t'), name: n, start: s, end: en }); CFG.terms.sort((x, y) => x.start < y.start ? -1 : 1); render(); toast('Term added.'); }
});
render();
