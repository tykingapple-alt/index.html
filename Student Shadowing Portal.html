<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Student Shadowing Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. Brand bar, tabs, content. Stacks to one column on phones. */
:root{
  --bg:#F4F7F8; --surface:#FFFFFF; --surface-2:#EBF0F2; --fg:#172229; --muted:#5A6B74; --line:#D5DDE2;
  --accent:#0E7470; --accent-fg:#FFFFFF; --accent-soft:#DBEEEB;
  --warn:#9A6207; --warn-soft:#F7E8CB; --bad:#AE3838; --bad-soft:#F5DDDD; --good:#2A7A4A; --good-soft:#DAEFE1;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px; --shadow:0 1px 2px rgba(23,34,41,.06),0 4px 14px rgba(23,34,41,.05);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0F161A; --surface:#172229; --surface-2:#1F2C34; --fg:#E7EDF0; --muted:#9AAAB3; --line:#2B3A43;
  --accent:#42B5AE; --accent-fg:#06211F; --accent-soft:#163C39;
  --warn:#E2AB4A; --warn-soft:#3A2E14; --bad:#E27A7A; --bad-soft:#3D2020; --good:#64C48B; --good-soft:#173B27;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F161A; --surface:#172229; --surface-2:#1F2C34; --fg:#E7EDF0; --muted:#9AAAB3; --line:#2B3A43;
  --accent:#42B5AE; --accent-fg:#06211F; --accent-soft:#163C39;
  --warn:#E2AB4A; --warn-soft:#3A2E14; --bad:#E27A7A; --bad-soft:#3D2020; --good:#64C48B; --good-soft:#173B27;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1140px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:26px;font-weight:600}
h2{font-size:20px;font-weight:600}
h3{font-size:16px;font-weight:600}
h4{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}
.fine{font-size:13px;color:var(--muted)}
.mono{font-family:var(--mono);font-size:13px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand .name{display:flex;align-items:baseline;gap:10px}
.brand .name .k{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.02em}
.brand .name .sep{color:var(--line)}
.brand .name .sub{font-size:13px;color:var(--muted)}
.brand .signed{font-size:13px;color:var(--muted)}

.subnav{display:flex;gap:4px;flex-wrap:wrap;margin-top:14px;border-bottom:1px solid var(--line)}
.subnav button{border:0;background:transparent;color:var(--muted);padding:8px 12px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.subnav button.on{color:var(--fg);border-bottom-color:var(--accent)}
.subnav button .pill{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:11px;font-weight:700;margin-left:4px;text-align:center}

.content{display:flex;flex-direction:column;gap:16px;margin-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.soft{background:var(--surface-2);border-color:transparent}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tile .v{font-family:var(--display);font-size:28px;font-weight:600;line-height:1}
.tile .l{font-size:12.5px;color:var(--muted);margin-top:6px}
.tile.warn{border-color:var(--warn)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.item{padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0;padding-top:0}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:7px;font-weight:600;font-size:14px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent);padding:0;font-weight:600}
.link.sm{font-size:13px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.backlink{border:0;background:none;color:var(--accent);font-weight:600;padding:0;display:inline-flex;gap:4px;align-items:center}

/* Info tooltips */
.info{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--surface-2);color:var(--muted);font-size:10.5px;font-weight:700;font-family:var(--mono);cursor:help;vertical-align:middle;margin-left:5px;border:1px solid var(--line);user-select:none}
.info:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
#tip{position:fixed;z-index:40;max-width:260px;background:var(--fg);color:var(--bg);font-size:12.5px;line-height:1.4;padding:8px 10px;border-radius:6px;box-shadow:var(--shadow);pointer-events:none}
#tip[hidden]{display:none}

.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.checks li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
.checks .mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.checks .ok .mark{background:var(--good-soft);color:var(--good);border-color:transparent}
.checks .t{font-weight:600}
.checks .d{font-size:13px;color:var(--muted)}

.doc{display:flex;flex-direction:column;gap:10px}
.doc .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.doc .spec{color:var(--accent);font-weight:600;font-size:13px}
.doc .site{font-size:13.5px;color:var(--muted)}
.doc .rule{font-size:13.5px}
.doc .reqs{display:flex;gap:6px;flex-wrap:wrap}
.doc .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.doc .next{font-size:13px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;flex:none;overflow:hidden;position:relative}
.avatar.lg{width:72px;height:72px;font-size:24px}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.edit{cursor:pointer;border:0;padding:0}
.avatar.edit .ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);color:#fff;font-size:11px;font-weight:600;font-family:var(--body);opacity:0;transition:opacity .15s;text-align:center;line-height:1.2}
.avatar.edit:hover .ov,.avatar.edit:focus-visible .ov{opacity:1}

.months{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface);text-align:left;width:100%}
.slot:hover:not(:disabled){border-color:var(--accent)}
.slot:disabled{cursor:not-allowed;color:var(--muted);background:var(--surface-2)}
.slot .d{font-weight:600}
.slot .s{font-size:12.5px;color:var(--muted)}
.slot .w{flex-basis:100%;font-size:12px;color:var(--muted);margin-top:-2px}
.slot{flex-wrap:wrap}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.row{flex-direction:row;gap:10px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);width:100%}
.field input[type=checkbox],.field input[type=radio],.filters input[type=checkbox]{width:auto;min-width:0;padding:0;flex:0 0 auto}
.field textarea{min-height:72px;resize:vertical}
.field.full,.form .full{grid-column:1/-1}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
legend{font-family:var(--display);font-weight:600;font-size:15px;margin-bottom:6px;padding:0}
.opt{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.opt input{margin-top:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);color:var(--muted);padding:7px 12px;font-weight:600;font-size:13px}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.upload{border:1px dashed var(--line);border-radius:7px;padding:14px;text-align:center;color:var(--muted);font-size:13px}
.codebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.codebox code{font-family:var(--mono);font-size:18px;letter-spacing:.06em;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}

.tw{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.wrap-ok{white-space:normal}
tr:last-child td{border-bottom:0}
td.heat{font-weight:600}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--fg)}
th.sortable.on{color:var(--fg)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.filters input{min-width:160px}
.field.narrow{max-width:200px}
.field.narrow input{width:110px}
.settings{display:flex;flex-direction:column;gap:16px}
.settings .card{padding:22px}
.settings h3{margin-bottom:4px}

.mail{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.mail .mh{background:var(--surface-2);padding:10px 14px;font-size:13px;display:grid;gap:2px}
.mail .mh b{font-weight:600}
.mail .mb{padding:14px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.mail .mb .big{font-family:var(--display);font-size:17px;font-weight:600}
.mail .mf{padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.mail.done{opacity:.7}

.notice{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:7px;background:var(--accent-soft);color:var(--fg);font-size:13.5px}
.notice.warn{background:var(--warn-soft)}
.notice.bad{background:var(--bad-soft)}
.notice.good{background:var(--good-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px);z-index:20;transition:opacity .2s}
.toast[hidden]{display:none}

/* Profile */
.pnav{display:flex;gap:4px;flex-wrap:wrap}
.pnav a{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;padding:4px 8px;border-radius:6px;background:var(--surface-2)}
.phead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.act{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:13.5px}
.act .w{color:var(--muted);white-space:nowrap}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.cal .day{min-height:76px;border:1px solid var(--line);border-radius:6px;padding:4px;display:flex;flex-direction:column;gap:3px;background:var(--surface);min-width:0}
.cal .day.off{background:var(--surface-2);border-color:transparent}
.cal .day.today{border-color:var(--accent)}
.cal .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal .ev{font-size:11px;line-height:1.25;padding:2px 5px;border-radius:4px;border:0;text-align:left;width:100%;background:var(--accent-soft);color:var(--accent);font-weight:600;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .ev.booked{background:var(--good-soft);color:var(--good)}
.cal .ev.req{background:var(--warn-soft);color:var(--warn)}
.cal .ev.sel{box-shadow:0 0 0 2px var(--accent)}
@media (max-width:640px){ .cal .day{min-height:56px} .cal .ev{font-size:10px;padding:1px 3px} }

.funnel{display:grid;grid-template-columns:max-content 1fr max-content;gap:6px 10px;align-items:center;font-size:13.5px}
.funnel .bar{height:18px;background:var(--accent);border-radius:3px;opacity:.85}
.funnel .lab{color:var(--muted)}
.confirm{max-width:560px}
.hub{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.hub a.card{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--fg)}
.hub a.card:hover{border-color:var(--accent)}

@media (max-width:640px){ h1{font-size:22px} }
@media (prefers-reduced-motion:reduce){ .toast,.avatar.edit .ov{transition:none} }
tr.actrow td{background:var(--surface-2);white-space:normal;padding:10px 14px}
.actions{display:flex;flex-direction:column;gap:8px}
.action{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:7px}

.menuwrap{position:relative}
.popover{position:absolute;right:0;top:calc(100% + 8px);width:min(460px,calc(100vw - 32px));max-height:min(72vh,680px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,.16);z-index:40;padding:18px;text-align:left}
.popover .kv{font-size:13px}
.popover .form{grid-template-columns:1fr}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.38);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;width:100%;max-width:440px;box-shadow:0 18px 48px rgba(0,0,0,.22)}
.modal h3{margin:0}
.modal p{margin:0}

.viewseg{display:flex;width:100%;max-width:520px}
.viewseg button{flex:1;padding:8px 12px;font-weight:600}
.avlist{display:flex;flex-direction:column;gap:10px}
.avmonth{margin:8px 0 0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.avcard{display:grid;grid-template-columns:150px 1fr auto;gap:14px;align-items:center;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:14px 16px;width:100%}
.avcard:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.avcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.avcard .when{display:flex;flex-direction:column}
.avcard .who{display:flex;gap:10px;align-items:center;min-width:0}
.avcard .txt{min-width:0}
.avcard .name{font-weight:600}
.avcard .arrow{font-size:26px;line-height:1;color:var(--muted);padding:0 4px}
@media (max-width:640px){.avcard{grid-template-columns:1fr auto}.avcard .who{grid-column:1/-1}.avcard .arrow{grid-row:1;grid-column:2}}

.sechead{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:0;background:none;padding:0;margin:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.sechead h3{margin:0}
.sechead .fine{margin-top:4px}
.sechead .chev{font-size:18px;color:var(--muted);transition:transform .15s;flex:0 0 auto}
.sechead[aria-expanded="true"] .chev{transform:rotate(180deg)}
.settings .card.collapsed{padding:16px 22px}

/* Onboarding step indicator */
.steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.steps .st{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.steps .st .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-size:12px}
.steps .st.on{color:var(--fg)} .steps .st.on .n{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.steps .st.done .n{background:var(--good-soft);color:var(--good);border-color:transparent}
.steps .sep{flex:1;height:1px;background:var(--line);min-width:12px}

/* Visit and action cards (physician portal) */
.vcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.vcard{display:flex;flex-direction:column;gap:8px;padding:14px 16px}
.vcard .when{font-weight:600;font-size:15px;line-height:1.3}
.vcard .when .fine{font-weight:400;margin-top:2px}
.vcard .meta{font-size:12.5px;color:var(--muted);line-height:1.5}
.vcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap}
.card.collapsed{padding:16px 22px}

/* Setup checklist */
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--fg);border-radius:3px}
.checks{display:flex;flex-direction:column;gap:10px}
.check{display:flex;align-items:flex-start;gap:10px}
.check .dot{width:20px;height:20px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:12px;background:var(--line);color:transparent;margin-top:1px}
.check.done .dot{background:var(--good-soft);color:var(--good);border:1px solid var(--good)}
.check>div{flex:1}
.check .btn{margin-left:auto}
.credrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* ---------- find ---------- */
function vBlockedStudent() { return `<section class="card stack"><h2>Find a physician</h2><div class="notice bad stack" style="gap:6px"><b>Your booking access is paused.</b><span>A missed visit or late cancellation on ${fmtLong(me().blockedAt)} was recorded. Email your leadership at ${esc(CFG.contactEmail)}; they can reinstate you right away. The no-show stays in your history, and physicians are not told about it.</span></div><div class="row"><button class="btn" data-action="go" data-view="mine">My shadowing</button></div></section>`; }
function capLine(month) {

  return n < cap ? `<span class="fine">${monthName(month)}: ${n} of ${cap} visits booked</span>` : '';
}
function capNotice(month) {
  const n = monthCount('avery', month), cap = capFor('avery', month); if (n < cap) return '';
  const req = DB.capRequests.find(c => c.studentId === 'avery' && c.month === month); const label = monthName(month);
  if (req) return `<div class="notice ${req.status === 'granted' ? 'good' : req.status === 'denied' ? 'bad' : 'warn'}">${req.status === 'pending' ? 'Your request for more visits in ' + label + ' is with your leadership. You will be emailed the decision.' : req.status === 'denied' ? 'Your request for more visits in ' + label + ' was not approved.' : 'Your leadership granted ' + req.extra + ' extra visit' + (req.extra > 1 ? 's' : '') + ' for ' + label + '.'}</div>`;
  return `<div class="notice warn stack" style="gap:8px"><div class="head" style="width:100%"><span>You have booked ${n} of ${cap} visits for ${label}.</span>${ui.capForm === month ? '' : `<button class="btn sm" data-action="capForm" data-month="${month}">Request more</button>`}</div>

      <div class="field"><label for="capNote">Note to leadership</label><textarea id="capNote" placeholder="What you're hoping to see and why this month"></textarea></div>
      <div class="row"><button class="btn primary" type="submit">Send request</button><button class="btn" type="button" data-action="capCancel">Cancel</button></div></form>` : ''}</div>`;
}
/* A slot passes the day and time filters on its own; the physician filters apply through matchesFilters. */
function slotMatches(s) { const f = ui.f; if (f.days.length && !f.days.includes(parse(s.iso).getDay())) return false; if ((f.from || f.to) && !((!f.from || s.end > f.from) && (!f.to || s.start < f.to))) return false; return true; }
function availabilityList(list) {
  const rows = []; list.forEach(d => bookable(d).filter(slotMatches).forEach(s => rows.push({ d, s })));
  rows.sort((a, b) => (a.s.iso + a.s.start) < (b.s.iso + b.s.start) ? -1 : 1);
  if (!rows.length) return `<div class="card"><p class="muted">No open dates match these filters.</p></div>`;
  let lastMonth = ''; const out = [];
  rows.forEach(({ d, s }) => { const mk = monthKey(s.iso); if (mk !== lastMonth) { out.push(`<h4 class="avmonth">${monthName(mk)}</h4>`); lastMonth = mk; }
    out.push(`<button class="card avcard" data-action="pickDate" data-id="${d.id}" data-key="${s.key}" aria-label="${fmtLong(s.iso)}, ${esc(d.name)}">
      <div class="when"><b>${fmt(s.iso)}</b><span class="fine">${span(s.start, s.end)}</span></div>
      <div class="who">${avatarHtml(d)}<div class="txt"><div class="name">${esc(d.name)}</div><div class="fine">${esc(d.specialty)} · ${esc(loc(d, s).name)}, ${esc(loc(d, s).city)}</div><div class="fine">${[s.cap > 1 && !link(d).approveEach ? s.seatsLeft + ' of ' + s.cap + ' seats left' : '', link(d).approveEach ? 'Approves each student' + (s.queue.length ? ' · ' + s.queue.length + ' in line' : '') : '', loc(d, s).paperwork.mode !== 'none' ? 'Site paperwork' : ''].filter(Boolean).join(' · ')}</div></div></div>
      <span class="arrow" aria-hidden="true">›</span></button>`); });
  return `<div class="avlist">${out.join('')}</div>`;
}
function matchesFilters(d) {
  const f = ui.f; const all = slotsFor(d);
  if (f.q && ![d.name, d.specialty, ...(d.locations || []).flatMap(l => [l.name, l.city])].some(x => x.toLowerCase().includes(f.q.toLowerCase()))) return false;
  if (f.specs.length && !f.specs.includes(d.specialty)) return false;
  if (f.days.length && !all.some(s => f.days.includes(parse(s.iso).getDay()))) return false;
  if ((f.from || f.to) && !all.some(s => (!f.from || s.end > f.from) && (!f.to || s.start < f.to))) return false;
  const bk = bookable(d); const within = n => bk.some(s => daysOut(s.iso) <= n);
  if (f.avail === 'open' && !bk.length) return false;
  if (f.avail === '30' && !within(30)) return false;
  if (f.avail === '60' && !within(60)) return false;
  if (f.avail === 'waitlist' && bk.length) return false;
  return true;
}

  slots.forEach(s => { let g = months.find(x => x.m === s.month && x.y === s.year); if (!g) { g = { m: s.month, y: s.year, items: [] }; months.push(g); } g.items.push(s); });
  const open = bookable(d).length; const wl = DB.waitlist.find(w => w.studentId === 'avery' && w.doctorId === d.id && w.status === 'waiting');
  const horizon = Math.max(...d.rules.map(r => r.horizon), 0); const multi = (d.locations || []).length > 1;
  return `
  <button class="backlink" data-action="back">← All physicians</button>
  <section class="card stack">
    <div class="head"><div class="phead">${avatarHtml(d, 'lg')}<div><h2>${esc(d.name)}</h2><div style="color:var(--accent);font-weight:600">${esc(d.specialty)} · ${esc(siteLine(d, ', '))}</div></div></div>${docChip(d)}</div>
    ${d.bio ? `<p>${esc(d.bio)}</p>` : ''}
    ${locBlocks(d)}
    ${link(d).approveEach ? `<dl class="kv"><dt>Booking</dt><dd>The physician approves each request</dd></dl>` : ''}
  </section>
  ${ui.pending ? vConfirm(d) : `
  <section class="card stack">
    <div class="head"><h3>Open dates</h3>${open === 0 ? (wl ? `<span class="row"><span class="chip acc">You're on the waitlist</span><button class="btn sm" data-action="leaveWait" data-id="${d.id}">Leave</button></span>` : `<button class="btn sm primary" data-action="joinWait" data-id="${d.id}">Join waitlist</button>`) : ''}</div>
    ${months.length ? `<div class="months">${months.map(g => `<div><div class="eyebrow" style="margin-bottom:8px">${MOL[g.m]} ${g.y}</div><div class="slots">${g.items.map(s => {
      const where = multi ? `<span class="w">${esc(loc(d, s).name)}</span>` : '';
      const mine = s.bookings.find(b => b.studentId === 'avery'); const conflict = !mine && studentConflict('avery', s); const declined = declinedFor('avery', s);
      if (mine) return `<button class="slot" disabled><span class="d">${fmt(s.iso)}</span><span class="s">${mine.status === 'confirmed' ? 'Yours' : 'Your request · ' + queueText(s, mine)}</span>${where}</button>`;
      if (declined) return `<button class="slot" disabled><span class="d">${fmt(s.iso)}</span><span class="s">Declined</span>${where}</button>`;
      if (s.seatsLeft === 0) return `<button class="slot" disabled><span class="d">${fmt(s.iso)}</span><span class="s">Booked</span>${where}</button>`;
      if (conflict) return `<button class="slot" disabled><span class="d">${fmt(s.iso)}</span><span class="s">${span(s.start, s.end)}</span><span class="w" style="color:var(--bad)">Conflicts with your existing visit${conflict.status === 'confirmed' ? '' : ' request'} (${esc(first(doc(conflict.doctorId).name))})</span>${where}</button>`;
      if (s.tooSoon) return `<button class="slot" disabled><span class="d">${fmt(s.iso)}</span><span class="s">Inside ${s.lead}-day notice</span>${where}</button>`;
      const seats = s.cap > 1 && !link(d).approveEach ? ' · ' + s.seatsLeft + ' of ' + s.cap + ' seats left' : ''; const q = link(d).approveEach && s.queue.length ? ' · ' + s.queue.length + ' in line' : '';
      return `<button class="slot" data-action="pick" data-key="${s.key}"><span class="d">${fmt(s.iso)}</span><span class="s">${span(s.start, s.end)}${seats}${q}</span>${where}</button>`; }).join('')}</div></div>`).join('')}</div>` : '<p class="muted">No dates in the next ' + Math.max(horizon, 60) + ' days.</p>'}
  </section>`}`;
}
function vConfirm(d) {
  const s = slotsFor(d).find(x => x.key === ui.pending); const m = monthKey(s.iso); const over = monthCount('avery', m) >= capFor('avery', m);
  return `
  <section class="card stack">
    <h3>${link(d).approveEach ? 'Request this visit' : 'Confirm your visit'}</h3>
    ${link(d).approveEach ? `<div class="notice"><div>${s.queue.length ? s.queue.length + ' student' + (s.queue.length > 1 ? 's have' : ' has') + ' already requested this visit. You would join the line as <b>#' + (s.queue.length + 1) + '</b>.' : 'No one has requested this visit yet; you would be first in line.'} ${esc(first(d.name))} answers requests in order${s.cap > 1 ? ', one per seat' : ''}, and your place stays even after the minimum notice passes.</div></div>` : s.cap > 1 ? `<div class="notice">${s.seatsLeft} of ${s.cap} seats are open on this visit.</div>` : ''}
    <dl class="kv"><dt>When</dt><dd><b>${fmtLong(s.iso)}</b> · ${span(s.start, s.end)}</dd><dt>With</dt><dd>${esc(d.name)}, ${esc(loc(d, s).name)}</dd><dt>Address</dt><dd>${esc(fullAddress(loc(d, s)))}</dd><dt>Cancel by</dt><dd>${cancelBy({ date: s.iso, start: s.start }, CFG.cancelHours)}</dd></dl>
    ${over ? capNotice(m) : ''}
    <ul class="rules">
      <li><b>Cancel at least ${CFG.cancelHours} hours ahead.</b> <span class="d">Later than that counts as a no-show unless it is an emergency.</span></li>
      <li><b>One no-show pauses your booking access.</b> <span class="d">Reinstatement is by your leadership.</span></li>
      <li><b>Arrive 15 minutes early, dressed as the physician asked.</b> <span class="d">Your confirmation email repeats the physician's requirements.</span></li>
    </ul>
    <label class="opt"><input type="checkbox" id="ack" data-action="ack" ${ui.ack ? 'checked' : ''}> I have read ${esc(first(d.name))}'s requirements and the no-show rule.</label>
    <div class="row"><button class="btn primary" data-action="confirm" ${(!ui.ack || over) ? 'disabled' : ''}>${link(d).approveEach ? (s.queue.length ? 'Join the line' : 'Send request') : 'Confirm booking'}</button><button class="btn" data-action="unpick">Choose another date</button></div>
    <p class="fine">${link(d).approveEach ? "The physician approves each request. We'll notify you when they respond." : 'A confirmation is sent to you and the physician.'}</p>
  </section>`;
}

/* ---------- my shadowing ---------- */
function reflForm(b, editOnly) {
  const r = b.refl || {};
  return `<div class="form" style="margin-top:8px">
    ${editOnly ? `<div class="field"><label>Hours on site · ${b.hoursStatus === 'confirmed' ? 'confirmed' : 'awaiting confirmation'}</label><input value="${b.hours.toFixed(1)}" disabled></div>` : `<div class="field"><label for="hrs">Hours on site</label><input id="hrs" type="number" step="0.5" min="0.5" max="12" value="${hoursBetween(b.start, b.end).toFixed(1)}"></div>`}
    <div class="field"><label>Date</label><input value="${fmtLong(b.date)}" disabled></div>
    <div class="field full"><label for="r1">What did you observe? (optional)</label><textarea id="r1">${esc(r.observed || '')}</textarea></div>
    <div class="field full"><label for="r2">What surprised you? (optional)</label><textarea id="r2">${esc(r.surprised || '')}</textarea></div>
    <div class="field full"><label for="r3">One question you'd ask next time (optional)</label><textarea id="r3">${esc(r.question || '')}</textarea></div>
    <div class="field full"><label for="r4">Anything else</label><textarea id="r4" placeholder="No patient information">${esc(r.free || '')}</textarea></div>
    <div class="full row">${editOnly ? `<button class="btn primary" data-action="saveRefl" data-id="${b.id}">Save reflection</button>` : `<button class="btn primary" data-action="submitLog" data-id="${b.id}">Submit hours</button>`}<button class="btn" data-action="logCancel">Cancel</button></div></div>`;
}
function reflView(b) {
  const r = b.refl; if (!r) return '';
  const rows = [['Observed', r.observed], ['Surprised', r.surprised], ['Question', r.question], ['Notes', r.free]].filter(x => x[1]);
  return rows.length ? `<dl class="kv" style="margin-top:6px;font-size:13px">${rows.map(x => `<dt>${x[0]}</dt><dd>${esc(x[1])}</dd>`).join('')}</dl>` : '';
}
function vMine() {
  const mine = DB.bookings.filter(b => b.studentId === 'avery').sort((a, b) => a.date < b.date ? 1 : -1);
  const up = mine.filter(b => b.status === 'confirmed').sort((a, b) => a.date < b.date ? -1 : 1); const reqs = mine.filter(inQueue).sort((a, b) => a.date < b.date ? -1 : 1); const past = mine.filter(b => b.status !== 'confirmed' && !inQueue(b));
  const hrs = mine.filter(b => b.hoursStatus === 'confirmed').reduce((a, b) => a + b.hours, 0); const pendingH = mine.filter(b => b.hoursStatus === 'pending').reduce((a, b) => a + b.hours, 0);
  const wls = DB.waitlist.filter(w => w.studentId === 'avery' && w.status === 'waiting');
  return `
  <div class="head"><h2>My shadowing</h2><div class="menuwrap"><button class="btn sm ${ui.account ? 'on' : ''}" data-action="accountToggle" aria-expanded="${ui.account}" aria-label="Account settings">⚙ Account</button>${ui.account ? vAccountPanel() : ''}</div></div>
  ${me().blockedAt ? `<div class="notice bad">Your booking access is paused after a missed visit or late cancellation. Email your leadership at ${esc(CFG.contactEmail)} to be reinstated.</div>` : ''}
  <div class="tiles">
    <div class="tile"><div class="v num">${hrs.toFixed(1)}</div><div class="l">Confirmed hours${pendingH ? ' · ' + pendingH.toFixed(1) + ' awaiting' : ''}</div></div>
    <div class="tile"><div class="v num">${mine.filter(b => b.status === 'completed').length}</div><div class="l">Visits completed</div></div>
    <div class="tile"><div class="v num">${up.length}</div><div class="l">Upcoming${reqs.length ? ' · ' + reqs.length + ' request' + (reqs.length > 1 ? 's' : '') + ' pending' : ''}</div></div>
    <div class="tile"><div class="v num">${me().strikes}</div><div class="l">No-shows</div></div>
  </div>
  <section class="card stack">
    <div class="head"><h3>Upcoming</h3>${wls.length ? `<span class="fine">Waitlisted: ${wls.map(w => esc(first(doc(w.doctorId).name))).join(', ')}</span>` : ''}</div>
    ${up.length ? up.map(b => { const d = doc(b.doctorId); const can = daysOut(b.date) * 24 >= CFG.cancelHours;
      return `<div class="head item"><div><b>${fmtLong(b.date)}</b> · ${span(b.start, b.end)}<div class="fine">${esc(d.name)} · ${esc(loc(d, b).name)} · ${esc(fullAddress(loc(d, b)))}${loc(d, b).paperwork.mode !== 'none' ? ' · site paperwork required' : ''}</div><div class="fine">${can ? 'Free cancellation until ' + cancelBy(b, CFG.cancelHours) : 'Inside the ' + CFG.cancelHours + '-hour window; cancelling now counts as a no-show'}</div></div>
        <div class="row">${bookingChip(b)}${can ? `<button class="btn sm danger" data-action="cancel" data-id="${b.id}">Cancel</button>` : `<button class="btn sm danger" data-action="cancelLate" data-id="${b.id}">Cancel late</button>`}</div></div>`; }).join('') : '<p class="muted">Nothing booked.</p>'}
  </section>
  ${reqs.length ? `<section class="card stack"><h3>Requests</h3>
    ${reqs.map(b => { const d = doc(b.doctorId); const s = slotsFor(d).find(x => x.iso === b.date && x.start === b.start) || { queue: [b], cap: 1, seatsLeft: 1 };
      return `<div class="head item"><div><b>${fmtLong(b.date)}</b> · ${span(b.start, b.end)}<div class="fine">${esc(d.name)} · ${esc(loc(d, b).name)}</div><div class="fine">${queueText(s, b)} · the physician answers requests in order; we'll notify you when they respond</div></div>
        <div class="row">${bookingChip(b)}<button class="btn sm" data-action="withdraw" data-id="${b.id}">Withdraw</button></div></div>`; }).join('')}
  </section>` : ''}
  <section class="card stack">
    <div class="head"><h3>History</h3><button class="btn sm" data-action="toast" data-msg="Export started. Your hours log and reflections will download as CSV and PDF.">Export</button></div>
    ${past.map(b => { const d = doc(b.doctorId);
      return `<div class="item"><div class="head"><div><b>${fmtLong(b.date)}</b><div class="fine">${esc(d.name)} · ${esc(loc(d).name)}${b.hours ? ' · ' + b.hours.toFixed(1) + ' h logged' : ''}</div></div>
        <div class="row">${bookingChip(b)}${b.status === 'completed' && b.hoursStatus === 'none' ? `<button class="btn sm" data-action="log" data-id="${b.id}">Log hours</button>` : b.hours && ui.logging !== b.id ? `<button class="btn sm" data-action="editRefl" data-id="${b.id}">${b.refl && Object.values(b.refl).some(Boolean) ? 'Edit reflection' : 'Add reflection'}</button>` : ''}</div></div>${ui.logging === b.id ? reflForm(b, ui.logMode === 'refl') : reflView(b)}</div>`; }).join('') || '<p class="muted">No past visits yet.</p>'}
  </section>`;
}

/* ---------- render and events ---------- */
function render() {
  const inApp = ui.phase === 'app';
  document.getElementById('subnav').innerHTML = inApp ? NAV.map(([k, l]) => `<button data-view="${k}" class="${k === ui.sv ? 'on' : ''}">${l}</button>`).join('') : '';
  document.getElementById('signed').textContent = (ui.phase === 'onboard' && (ui.step === 'profile' || ui.step === 'verify')) || ui.phase === 'signin' ? '' : 'Signed in as ' + me().email;
  document.getElementById('app').innerHTML = ui.phase === 'onboard' ? vOnboard() : ui.phase === 'signin' ? vSignin() : ui.sv === 'find' ? (ui.selected ? vDetail() : vFind()) : vMine();
}
document.getElementById('subnav').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; ui.sv = b.dataset.view; ui.selected = null; ui.pending = null; ui.ack = false; ui.capForm = null; ui.account = false; render(); });
document.getElementById('app').addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  if (el.tagName === 'INPUT' || el.tagName === 'FORM' || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA' || el.tagName === 'LABEL') return;
  const a = el.dataset.action, id = el.dataset.id;
  switch (a) {
    case 'go': ui.sv = el.dataset.view; ui.selected = null; ui.pending = null; ui.capForm = null; break;
    case 'changeEmail': ui.step = 'profile'; break;
    case 'enter': ui.phase = 'app'; ui.sv = 'find'; break;
    case 'signout': ui.phase = 'signin'; ui.step = 'email'; ui.account = false; break;
    case 'accountToggle': ui.account = !ui.account; ui.editProfile = false; break;
    case 'accountClose': ui.account = false; ui.editProfile = false; break;
    case 'accountOpenMine': ui.sv = 'mine'; ui.account = true; ui.editProfile = true; break;
    case 'profileEdit': ui.editProfile = true; break;
    case 'photoPick': { const f = document.getElementById('photoFile'); if (f) f.click(); return; }
    case 'photoRemove': me().photo = ''; toast('Photo removed.'); break;
    case 'profileCancel': ui.editProfile = false; break;
    case 'profileConfirm': ui.confirmProfile = false; toast('Thanks. We will ask again next term.'); break;
    case 'toggleFilters': ui.filtersOpen = !ui.filtersOpen; break;
    case 'clearFilters': ui.f = { q: '', specs: [], days: [], from: '', to: '', avail: 'any' }; break;
    case 'open': ui.selected = id; ui.pending = null; ui.ack = false; break;
    case 'view': ui.view = el.dataset.view; try { localStorage.setItem('findView', ui.view); } catch (e) {} break;
    case 'pickDate': ui.selected = id; ui.pending = el.dataset.key; ui.ack = false; break;
    case 'back': ui.selected = null; ui.pending = null; break;
    case 'pick': ui.pending = el.dataset.key; ui.ack = false; break;
    case 'unpick': ui.pending = null; ui.ack = false; break;
    case 'confirm': { const d = doc(ui.selected); const s = slotsFor(d).find(x => x.key === ui.pending);
      const cf = studentConflict('avery', s); if (cf) { toast('That overlaps your visit with ' + doc(cf.doctorId).name + '.'); ui.pending = null; break; }
      if (s.seatsLeft === 0) { toast('That date was just taken.'); ui.pending = null; break; }
      const q = link(d).approveEach; const pos = q ? s.queue.length + 1 : null; const activeAhead = s.queue.some(b => b.status === 'requested');
      DB.bookings.push({ id: nid('b'), studentId: 'avery', doctorId: d.id, locationId: s.locationId, date: s.iso, start: s.start, end: s.end, status: q ? (activeAhead ? 'queued' : 'requested') : 'confirmed', queuePos: pos, requestedAt: TODAY_ISO, seat: q ? null : s.confirmed.length + 1, hours: null, hoursStatus: 'none' });
      logActivity(d, 'System', (q ? 'Request from ' : 'Booking by ') + me().name + ' for ' + fmt(s.iso) + (pos ? ' (#' + pos + ' in line)' : ''));
      ui.pending = null; ui.selected = null; ui.sv = 'mine'; ui.ack = false; toast(q ? 'Request sent. You are #' + pos + ' in line for ' + first(d.name) + '.' : 'Booked. Confirmation sent.'); break; }
    case 'withdraw': { const b = DB.bookings.find(x => x.id === id); confirmAction('Withdraw this request?', 'Your request to shadow ' + esc(doc(b.doctorId).name) + ' on ' + fmtLong(b.date) + ' is removed from the line. You can request the date again later if it is still open.', 'Withdraw request', () => { b.status = 'withdrawn'; const p = promoteQueue(doc(b.doctorId), b.date, b.start); if (p) logActivity(doc(b.doctorId), 'System', 'Next request in line sent for ' + fmt(b.date)); toast('Request withdrawn.'); }, false); return; }
    case 'cancelLate': { const b = DB.bookings.find(x => x.id === id); openModal({ title: 'Cancel inside the window?', ok: 'Cancel late', cancel: 'Keep the visit', danger: true,
        body: `<p>This visit is less than ${CFG.cancelHours} hours away. Cancelling now counts as a no-show: your booking access pauses until your leadership reinstates you, and the no-show stays in your history. The office is told the visit is cancelled, nothing more.</p><div class="field"><label for="lateNote">Note to your leadership (optional)</label><textarea id="lateNote" placeholder="What happened"></textarea></div>`,
        onOk: m => { cancelBooking(b, 'student_late', null, ((m.querySelector('#lateNote') || {}).value || '').trim()); toast('Visit cancelled. Your leadership has been emailed.'); } }); return; }
    case 'requestAccess': ui.step = 'request'; break;
    case 'backToCode': ui.step = 'code'; break;
    case 'cancel': { const b = DB.bookings.find(x => x.id === id); confirmAction('Cancel this visit?', 'Your visit with ' + esc(doc(b.doctorId).name) + ' on ' + fmtLong(b.date) + ' will be cancelled and the office told. The date reopens for other students.', 'Cancel visit', () => { cancelBooking(b, 'student'); toast('Visit cancelled.'); }); return; }
    case 'joinWait': DB.waitlist.push({ id: nid('w'), studentId: 'avery', doctorId: id, createdAt: TODAY_ISO, status: 'waiting' }); toast("You're on the waitlist. You'll be emailed when a date opens."); break;
    case 'leaveWait': { const w = DB.waitlist.find(x => x.studentId === 'avery' && x.doctorId === id && x.status === 'waiting'); if (w) w.status = 'expired'; toast('Removed from the waitlist.'); break; }
    case 'capForm': ui.capForm = el.dataset.month; break;
    case 'capCancel': ui.capForm = null; break;
    case 'log': ui.logging = id; ui.logMode = 'log'; break;
    case 'editRefl': ui.logging = id; ui.logMode = 'refl'; break;
    case 'saveRefl': { const b = DB.bookings.find(x => x.id === id); const v = i => (document.getElementById(i) || {}).value || ''; b.refl = { observed: v('r1'), surprised: v('r2'), question: v('r3'), free: v('r4') }; ui.logging = null; toast('Reflection saved.'); break; }
    case 'logCancel': ui.logging = null; break;
    case 'submitLog': { const b = DB.bookings.find(x => x.id === id); const v = i => (document.getElementById(i) || {}).value || '';
      b.hours = parseFloat(v('hrs')) || hoursBetween(b.start, b.end); b.hoursStatus = 'pending'; b.loggedOn = TODAY_ISO; b.refl = { observed: v('r1'), surprised: v('r2'), question: v('r3'), free: v('r4') }; ui.logging = null; toast('Hours submitted for confirmation.'); break; }
    case 'toast': toast(el.dataset.msg); return;
    default: return;
  }
  render();
});
document.addEventListener('click', e => { if (ui.account && !e.target.closest('.menuwrap')) { ui.account = false; ui.editProfile = false; render(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.account) { ui.account = false; ui.editProfile = false; render(); } });
document.getElementById('app').addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.action === 'ack') { ui.ack = el.checked; render(); return; }
  if (el.dataset.action === 'photoFile') { const file = el.files && el.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => { me().photo = r.result; toast('Photo added.'); render(); }; r.readAsDataURL(file); return; }
  if (el.dataset.fcheck) { const k = el.dataset.fcheck; const val = k === 'days' ? Number(el.value) : el.value; ui.f[k] = el.checked ? [...ui.f[k], val] : ui.f[k].filter(x => x !== val); render(); return; }
  if (el.dataset.ftime) { ui.f[el.dataset.ftime] = el.value; render(); return; }
  if (el.dataset.fradio) { ui.f[el.dataset.fradio] = el.value; render(); }
});
document.getElementById('app').addEventListener('input', e => { const el = e.target; if (!el.dataset.filter || el.tagName !== 'INPUT') return; ui.f[el.dataset.filter] = el.value; render(); const n = document.getElementById('q-find'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } });
document.getElementById('app').addEventListener('submit', e => {
  e.preventDefault(); const f = e.target; const v = i => { const x = document.getElementById(i); return x ? x.value.trim() : ''; };
  if (f.dataset.action === 'profileSubmit') { const m = me(); const em = v('pe'); if (!ui.editProfile && em && !em.toLowerCase().endsWith('@' + CFG.domain)) { toast('Use your @' + CFG.domain + ' address.'); return; }
    m.first = v('pf') || m.first; m.last = v('pl') || m.last; m.suffix = v('ps'); m.display = v('pd'); m.bio = v('pb').slice(0, 300); syncName(m); if (!ui.editProfile) m.email = em || m.email; m.phone = v('pp') ? toE164(v('pp')) : m.phone; m.year = v('py') || m.year; m.gradTerm = v('pg') || m.gradTerm;
    if (ui.editProfile) { ui.editProfile = false; render(); toast('Profile saved.'); } else { ui.step = 'verify'; ui.vcode = ''; ui.vcodeError = false; render(); toast('Verification code sent to ' + m.email + '.'); } return; }
  if (f.dataset.action === 'codeSubmit') { const typed = v('code').toUpperCase().replace(/\s+/g, ''); ui.codeInput = typed;
    if (typed === CFG.code.toUpperCase()) { ui.activatedOn = TODAY_ISO; me().activated = TODAY_ISO; me().elig = { status: 'approved', method: 'code', on: TODAY_ISO, expires: CFG.codeExpires }; ui.step = 'done'; ui.codeError = false; ui.codeInput = ''; render(); } else { ui.codeError = true; render(); } return; }
  if (f.dataset.action === 'requestSubmit') { me().elig = { status: 'pending', method: 'manual', requestedOn: TODAY_ISO, note: v('reqNote') }; ui.step = 'pending'; render(); toast('Request sent.'); return; }
  if (f.dataset.action === 'signin') { ui.step = 'sent'; ui.vcode = ''; ui.vcodeError = false; render(); toast('Sign-in code sent.'); return; }
  if (f.dataset.action === 'verifySubmit' || f.dataset.action === 'signinCode') { const code = v('vcode').replace(/\s+/g, ''); ui.vcode = v('vcode');
    if (/^\d{6}$/.test(code)) { ui.vcodeError = false; ui.vcode = ''; if (f.dataset.action === 'verifySubmit') { ui.step = 'code'; toast('Email verified.'); } else if (me().elig && me().elig.status === 'pending') { ui.phase = 'onboard'; ui.step = 'pending'; } else if (!me().activated) { ui.phase = 'onboard'; ui.step = 'code'; } else { ui.phase = 'app'; ui.sv = 'find'; ui.step = 'done'; toast('Signed in.'); } } else ui.vcodeError = true; render(); return; }
  if (f.dataset.action === 'capSubmit') { DB.capRequests.push({ id: nid('c'), studentId: 'avery', month: f.dataset.month, note: v('capNote'), requestedAt: TODAY_ISO, status: 'pending', extra: null }); ui.capForm = null; render(); toast('Request sent to your leadership.'); }
});
render();
</script>
