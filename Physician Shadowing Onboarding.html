<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Physician Shadowing Onboarding</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. Brand bar, tabs, content. Stacks to one column on phones. */
:root{
  --bg:#F4F7F8; --surface:#FFFFFF; --surface-2:#EBF0F2; --fg:#172229; --muted:#5A6B74; --line:#D5DDE2;
  --accent:#0E7470; --accent-fg:#FFFFFF; --accent-soft:#DBEEEB;
  --warn:#9A6207; --warn-soft:#F7E8CB; --bad:#AE3838; --bad-soft:#F5DDDD; --good:#2A7A4A; --good-soft:#DAEFE1;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px; --shadow:0 1px 2px rgba(23,34,41,.06),0 4px 14px rgba(23,34,41,.05);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0F161A; --surface:#172229; --surface-2:#1F2C34; --fg:#E7EDF0; --muted:#9AAAB3; --line:#2B3A43;
  --accent:#42B5AE; --accent-fg:#06211F; --accent-soft:#163C39;
  --warn:#E2AB4A; --warn-soft:#3A2E14; --bad:#E27A7A; --bad-soft:#3D2020; --good:#64C48B; --good-soft:#173B27;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F161A; --surface:#172229; --surface-2:#1F2C34; --fg:#E7EDF0; --muted:#9AAAB3; --line:#2B3A43;
  --accent:#42B5AE; --accent-fg:#06211F; --accent-soft:#163C39;
  --warn:#E2AB4A; --warn-soft:#3A2E14; --bad:#E27A7A; --bad-soft:#3D2020; --good:#64C48B; --good-soft:#173B27;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1140px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:26px;font-weight:600}
h2{font-size:20px;font-weight:600}
h3{font-size:16px;font-weight:600}
h4{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}
.fine{font-size:13px;color:var(--muted)}
.mono{font-family:var(--mono);font-size:13px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand .name{display:flex;align-items:baseline;gap:10px}
.brand .name .k{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.02em}
.brand .name .sep{color:var(--line)}
.brand .name .sub{font-size:13px;color:var(--muted)}
.brand .signed{font-size:13px;color:var(--muted)}

.subnav{display:flex;gap:4px;flex-wrap:wrap;margin-top:14px;border-bottom:1px solid var(--line)}
.subnav button{border:0;background:transparent;color:var(--muted);padding:8px 12px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.subnav button.on{color:var(--fg);border-bottom-color:var(--accent)}
.subnav button .pill{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:11px;font-weight:700;margin-left:4px;text-align:center}

.content{display:flex;flex-direction:column;gap:16px;margin-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.soft{background:var(--surface-2);border-color:transparent}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tile .v{font-family:var(--display);font-size:28px;font-weight:600;line-height:1}
.tile .l{font-size:12.5px;color:var(--muted);margin-top:6px}
.tile.warn{border-color:var(--warn)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.item{padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0;padding-top:0}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:7px;font-weight:600;font-size:14px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent);padding:0;font-weight:600}
.link.sm{font-size:13px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.backlink{border:0;background:none;color:var(--accent);font-weight:600;padding:0;display:inline-flex;gap:4px;align-items:center}

/* Info tooltips */
.info{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--surface-2);color:var(--muted);font-size:10.5px;font-weight:700;font-family:var(--mono);cursor:help;vertical-align:middle;margin-left:5px;border:1px solid var(--line);user-select:none}
.info:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
#tip{position:fixed;z-index:40;max-width:260px;background:var(--fg);color:var(--bg);font-size:12.5px;line-height:1.4;padding:8px 10px;border-radius:6px;box-shadow:var(--shadow);pointer-events:none}
#tip[hidden]{display:none}

.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.checks li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
.checks .mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.checks .ok .mark{background:var(--good-soft);color:var(--good);border-color:transparent}
.checks .t{font-weight:600}
.checks .d{font-size:13px;color:var(--muted)}

.doc{display:flex;flex-direction:column;gap:10px}
.doc .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.doc .spec{color:var(--accent);font-weight:600;font-size:13px}
.doc .site{font-size:13.5px;color:var(--muted)}
.doc .rule{font-size:13.5px}
.doc .reqs{display:flex;gap:6px;flex-wrap:wrap}
.doc .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.doc .next{font-size:13px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;flex:none;overflow:hidden;position:relative}
.avatar.lg{width:72px;height:72px;font-size:24px}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.edit{cursor:pointer;border:0;padding:0}
.avatar.edit .ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);color:#fff;font-size:11px;font-weight:600;font-family:var(--body);opacity:0;transition:opacity .15s;text-align:center;line-height:1.2}
.avatar.edit:hover .ov,.avatar.edit:focus-visible .ov{opacity:1}

.months{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface);text-align:left;width:100%}
.slot:hover:not(:disabled){border-color:var(--accent)}
.slot:disabled{cursor:not-allowed;color:var(--muted);background:var(--surface-2)}
.slot .d{font-weight:600}
.slot .s{font-size:12.5px;color:var(--muted)}
.slot .w{flex-basis:100%;font-size:12px;color:var(--muted);margin-top:-2px}
.slot{flex-wrap:wrap}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.row{flex-direction:row;gap:10px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);width:100%}
.field input[type=checkbox],.field input[type=radio],.filters input[type=checkbox]{width:auto;min-width:0;padding:0;flex:0 0 auto}
.field textarea{min-height:72px;resize:vertical}
.field.full,.form .full{grid-column:1/-1}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
legend{font-family:var(--display);font-weight:600;font-size:15px;margin-bottom:6px;padding:0}
.opt{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.opt input{margin-top:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);color:var(--muted);padding:7px 12px;font-weight:600;font-size:13px}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.upload{border:1px dashed var(--line);border-radius:7px;padding:14px;text-align:center;color:var(--muted);font-size:13px}
.codebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.codebox code{font-family:var(--mono);font-size:18px;letter-spacing:.06em;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}

.tw{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.wrap-ok{white-space:normal}
tr:last-child td{border-bottom:0}
td.heat{font-weight:600}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--fg)}
th.sortable.on{color:var(--fg)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.filters input{min-width:160px}
.field.narrow{max-width:200px}
.field.narrow input{width:110px}
.settings{display:flex;flex-direction:column;gap:16px}
.settings .card{padding:22px}
.settings h3{margin-bottom:4px}

.mail{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.mail .mh{background:var(--surface-2);padding:10px 14px;font-size:13px;display:grid;gap:2px}
.mail .mh b{font-weight:600}
.mail .mb{padding:14px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.mail .mb .big{font-family:var(--display);font-size:17px;font-weight:600}
.mail .mf{padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.mail.done{opacity:.7}

.notice{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:7px;background:var(--accent-soft);color:var(--fg);font-size:13.5px}
.notice.warn{background:var(--warn-soft)}
.notice.bad{background:var(--bad-soft)}
.notice.good{background:var(--good-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px);z-index:20;transition:opacity .2s}
.toast[hidden]{display:none}

/* Profile */
.pnav{display:flex;gap:4px;flex-wrap:wrap}
.pnav a{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;padding:4px 8px;border-radius:6px;background:var(--surface-2)}
.phead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.act{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:13.5px}
.act .w{color:var(--muted);white-space:nowrap}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.cal .day{min-height:76px;border:1px solid var(--line);border-radius:6px;padding:4px;display:flex;flex-direction:column;gap:3px;background:var(--surface);min-width:0}
.cal .day.off{background:var(--surface-2);border-color:transparent}
.cal .day.today{border-color:var(--accent)}
.cal .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal .ev{font-size:11px;line-height:1.25;padding:2px 5px;border-radius:4px;border:0;text-align:left;width:100%;background:var(--accent-soft);color:var(--accent);font-weight:600;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .ev.booked{background:var(--good-soft);color:var(--good)}
.cal .ev.req{background:var(--warn-soft);color:var(--warn)}
.cal .ev.sel{box-shadow:0 0 0 2px var(--accent)}
@media (max-width:640px){ .cal .day{min-height:56px} .cal .ev{font-size:10px;padding:1px 3px} }

.funnel{display:grid;grid-template-columns:max-content 1fr max-content;gap:6px 10px;align-items:center;font-size:13.5px}
.funnel .bar{height:18px;background:var(--accent);border-radius:3px;opacity:.85}
.funnel .lab{color:var(--muted)}
.confirm{max-width:560px}
.hub{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.hub a.card{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--fg)}
.hub a.card:hover{border-color:var(--accent)}

@media (max-width:640px){ h1{font-size:22px} }
@media (prefers-reduced-motion:reduce){ .toast,.avatar.edit .ov{transition:none} }
tr.actrow td{background:var(--surface-2);white-space:normal;padding:10px 14px}
.actions{display:flex;flex-direction:column;gap:8px}
.action{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:7px}

.menuwrap{position:relative}
.popover{position:absolute;right:0;top:calc(100% + 8px);width:min(460px,calc(100vw - 32px));max-height:min(72vh,680px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,.16);z-index:40;padding:18px;text-align:left}
.popover .kv{font-size:13px}
.popover .form{grid-template-columns:1fr}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.38);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;width:100%;max-width:440px;box-shadow:0 18px 48px rgba(0,0,0,.22)}
.modal h3{margin:0}
.modal p{margin:0}

.viewseg{display:flex;width:100%;max-width:520px}
.viewseg button{flex:1;padding:8px 12px;font-weight:600}
.avlist{display:flex;flex-direction:column;gap:10px}
.avmonth{margin:8px 0 0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.avcard{display:grid;grid-template-columns:150px 1fr auto;gap:14px;align-items:center;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:14px 16px;width:100%}
.avcard:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.avcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.avcard .when{display:flex;flex-direction:column}
.avcard .who{display:flex;gap:10px;align-items:center;min-width:0}
.avcard .txt{min-width:0}
.avcard .name{font-weight:600}
.avcard .arrow{font-size:26px;line-height:1;color:var(--muted);padding:0 4px}
@media (max-width:640px){.avcard{grid-template-columns:1fr auto}.avcard .who{grid-column:1/-1}.avcard .arrow{grid-row:1;grid-column:2}}

.sechead{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:0;background:none;padding:0;margin:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.sechead h3{margin:0}
.sechead .fine{margin-top:4px}
.sechead .chev{font-size:18px;color:var(--muted);transition:transform .15s;flex:0 0 auto}
.sechead[aria-expanded="true"] .chev{transform:rotate(180deg)}
.settings .card.collapsed{padding:16px 22px}

/* Onboarding step indicator */
.steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.steps .st{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.steps .st .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-size:12px}
.steps .st.on{color:var(--fg)} .steps .st.on .n{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.steps .st.done .n{background:var(--good-soft);color:var(--good);border-color:transparent}
.steps .sep{flex:1;height:1px;background:var(--line);min-width:12px}

/* Visit and action cards (physician portal) */
.vcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.vcard{display:flex;flex-direction:column;gap:8px;padding:14px 16px}
.vcard .when{font-weight:600;font-size:15px;line-height:1.3}
.vcard .when .fine{font-weight:400;margin-top:2px}
.vcard .meta{font-size:12.5px;color:var(--muted);line-height:1.5}
.vcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap}
.card.collapsed{padding:16px 22px}

/* Setup checklist */
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--fg);border-radius:3px}
.checks{display:flex;flex-direction:column;gap:10px}
.check{display:flex;align-items:flex-start;gap:10px}
.check .dot{width:20px;height:20px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:12px;background:var(--line);color:transparent;margin-top:1px}
.check.done .dot{background:var(--good-soft);color:var(--good);border:1px solid var(--good)}
.check>div{flex:1}

const steps = () => { const list = FLOWS[ui.mode]; const idx = list.indexOf(ui.step); return `<div class="steps">${list.map((k, i) => `<div class="st ${i < idx ? 'done' : i === idx ? 'on' : ''}"><span class="n">${i < idx ? (F.skipped[k] ? '–' : '✓') : i + 1}</span>${LABELS[k]}</div>`).join('<span class="sep"></span>')}</div>`; };
const next = () => { const list = FLOWS[ui.mode]; const i = list.indexOf(ui.step); if (i < list.length - 1) ui.step = list[i + 1]; else ui.done = ui.mode; };
const back = () => { const list = FLOWS[ui.mode]; const i = list.indexOf(ui.step); if (i > 0) ui.step = list[i - 1]; else ui.mode = 'landing'; };
const navRow = (label, skip) => `<div class="row"><button class="btn primary" type="submit">${label || 'Continue'}</button><button class="btn" type="button" data-action="back">Back</button>${skip ? `<button class="link" type="button" data-action="skip" data-step="${ui.step}">Skip for now</button>` : ''}</div>${skip ? `<p class="fine">Skip for now: ${esc(SKIPPABLE[ui.step])}</p>` : ''}`;

function vLanding() {
  return `<section class="card stack onboard" style="max-width:720px">
    ${ui.invited ? `<div class="fine">${esc(CFG.affiliation)}</div><h2>${esc(CFG.org)} has invited you to offer clinical shadowing through Keivos.</h2><p>${esc(CFG.programDesc)}</p>` : `<h2>Create your Keivos physician profile</h2><p>One profile serves every pre-med organization you choose to work with. It is free for physicians, always.</p>`}
    <h4>Do you already have a Keivos physician profile?</h4>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
      <button class="card avcard" data-action="mode" data-mode="existing" style="grid-template-columns:1fr auto"><div><b>Use my existing profile</b><div class="fine">Sign in with your professional email${ui.invited ? ' and choose what ' + esc(CFG.org) + ' sees' : ''}.</div></div><span class="arrow">›</span></button>
      <button class="card avcard" data-action="mode" data-mode="${ui.invited ? 'new' : 'independent'}" style="grid-template-columns:1fr auto"><div><b>Create a new profile</b><div class="fine">About five minutes. Everything after your name can wait.</div></div><span class="arrow">›</span></button>
    </div>
    ${ui.invited ? `<p class="fine">Scheduling coordinator or office staff setting this up for a physician? <button class="link" data-action="mode" data-mode="coordinator">Start here</button>. The physician confirms by email before anything goes live.</p>
    <p class="fine">Not from ${esc(CFG.org)}? <button class="link" data-action="noInvite">Create a profile without an invitation</button></p>` : `<p class="fine">Invited by an organization? Open the link they sent you instead, so the connection is set up at the same time.</p>`}
  </section>`;
}
function codeForm(known, email) {
  return `<p>We sent a 6-digit code to <b>${esc(email)}</b>. It works for 15 minutes.</p><form class="stack" data-action="codeSubmit" style="max-width:320px"><div class="field"><input id="vcode" class="mono" inputmode="numeric" maxlength="7" placeholder="000 000" autocomplete="one-time-code" value="${esc(ui.vcode)}" aria-label="Code"></div>${ui.vcodeError ? '<div class="notice bad">That code isn\'t right. Check the email or request a new code.</div>' : ''}<div class="row"><button class="btn primary" type="submit">${known ? 'Sign in' : 'Verify'}</button><button class="btn" type="button" data-action="toast" data-msg="New code sent.">Resend code</button><button class="link" type="button" data-action="changeEmail">Change email</button></div></form>`;
}
function vVerify() {
  const known = ui.mode === 'existing';
  if (ui.vcodeSent) return `<h2>${known ? 'Sign in' : 'Verify your email'}</h2>${codeForm(known, F.email)}`;
  return `<h2>${known ? 'Sign in to your profile' : 'Start with your professional email'}</h2><p class="fine">${known ? 'We\'ll email a code to the address on your profile.' : 'This is where your codes and action emails go. We\'ll email a code to confirm it is yours.'}</p>
    <form class="stack" data-action="emailSubmit" style="max-width:360px"><div class="field"><label for="f-email">Professional email</label>${inp('email', 'type="email" placeholder="you@practice.com" required')}</div>${ui.dupe ? `<div class="notice warn">This email already has a Keivos profile. <button class="link" data-action="useExisting">Sign in and use it</button> instead of creating a second one.</div>` : ''}${navRow('Send code')}</form>`;
}
function vProfileStep() {
  return `<h2>Your professional profile</h2><p class="fine">Shown to students at every organization you connect to. Photo, suffix, preferred name and bio are optional.</p>
    <form class="stack" data-action="profileSubmit"><div class="head"><div class="phead">
      <button class="avatar lg edit" type="button" data-action="photoPick" aria-label="Add photo">${F.photo ? `<img src="${F.photo}" alt="">` : '<span style="font-size:22px">+</span>'}<span class="ov">${F.photo ? 'Change photo' : 'Add photo'}</span></button>
      <input type="file" accept="image/*" id="photoFile" data-action="photoFile" hidden>
      <div class="fine">${F.photo ? '<button class="link" type="button" data-action="photoRemove">Remove photo</button>' : 'A photo helps students recognise you on the day.'}</div></div></div>
    <div class="form">
      ${nameFields(F, true)}
      <div class="field"><label for="f-specialty">Specialty</label>${sel('specialty', [['', 'Choose…'], ...SPECIALTIES, ['other', 'Other']])}</div>
      ${F.specialty === 'other' ? `<div class="field"><label for="f-specOther">Your specialty</label>${inp('specOther', 'placeholder="Addiction Medicine" required')}</div>` : ''}
      <div class="field full"><label for="f-bio">Short bio (optional)</label><textarea id="f-bio" data-f="bio" placeholder="What students will see with you, and what you like them to do">${esc(F.bio)}</textarea></div>
    </div>${navRow()}</form>`;
}
function vConnect() {
  const d = ui.mode === 'existing' ? existing() : F; const o = F.orgs[0]; const locs = d.locations || [];
  return `<h2>Connect with ${esc(CFG.org)}</h2>
    ${ui.mode === 'existing' ? `<div class="phead" style="margin-bottom:6px">${avatarHtml(d, 'lg')}<div><b>${esc(d.name)}</b><div class="fine">${esc(d.specialty)} · ${locs.map(l => esc(l.name)).join(' · ')}</div><div class="fine">Already connected to ${d.orgs.filter(x => x.slug !== CFG.slug).map(x => esc(x.org)).join(' and ') || 'no other organization'}</div></div></div>` : ''}
    <p>${esc(CFG.programDesc)}</p>
    <div class="grid2">
      <div class="stack" style="gap:4px"><h4>Every student has</h4><ul class="rules" style="margin:0">${CFG.studentPrep.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
      <div class="stack" style="gap:4px"><h4>What participation involves</h4><ul class="rules" style="margin:0">${CFG.participation.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
    </div>
    <form class="stack" data-action="connectSubmit">
      ${ui.mode === 'existing' ? `<div class="form"><div class="field"><label>Availability they see${info(TIPS.shared)}</label><select data-field="availability" data-org="0" data-id="new"><option value="shared" ${o.availability === 'shared' ? 'selected' : ''}>My existing availability (${esc(d.rules.map(ruleText).join('; ') || 'none yet')})</option><option value="own" ${o.availability === 'own' ? 'selected' : ''}>Dates I add for this organization only</option></select></div></div>` : ''}
      <label class="opt"><input type="checkbox" id="agree" ${F.agree ? 'checked' : ''}> I'd like to connect my Keivos profile to ${esc(CFG.org)}. Their administrators review new physicians before students can see me, and I can pause or leave at any time.</label>
      ${navRow('Connect')}</form>`;
}
function vShadow() {
  const o = F.orgs[0];
  return `<h2>Shadowing preferences for ${esc(CFG.org)}</h2><p class="fine">How their students book with you. Each organization you connect to has its own.</p>
    <form class="stack" data-action="shadowSubmit"><div class="form">
      <div class="field"><label>Which students</label><select data-field="years" data-org="0" data-id="new"><option ${o.years === 'Any year' ? 'selected' : ''}>Any year</option><option ${o.years === 'Juniors & seniors' ? 'selected' : ''}>Juniors & seniors</option></select></div>
      <div class="field"><label>Approve each student by name?${info(TIPS.approve)}</label><select data-field="approveEach" data-org="0" data-id="new"><option value="no" ${!o.approveEach ? 'selected' : ''}>No, confirm automatically</option><option value="yes" ${o.approveEach ? 'selected' : ''}>Yes, email me first</option></select></div>
    </div>${navRow(ui.mode === 'existing' ? 'Finish' : 'Continue', true)}</form>`;
}
function vLocation() {
  if (!PUI.locDraft) PUI.locDraft = blankLoc(); const co = ui.mode === 'coordinator';
  return `<h2>${co ? 'The practice location' : 'Your practice location'}</h2><p class="fine">${co ? 'Where students come. You become the scheduling coordinator for this location once the physician confirms.' : 'Where students come. Each location keeps its own arrival instructions, paperwork and scheduling coordinator, and you can add more later.'}</p>
    <form class="stack" data-action="locationSubmit"><div class="form">${locationFields(PUI.locDraft, { invite: !co })}</div>${navRow('Continue', true)}</form>`;
}
function vPrefs() {
  const p = F.prefs;
  return `<h2>Communication preferences</h2><p class="fine">Booking requests, confirmations, reminders and attendance questions are always sent. Choose the rest.</p>
    <form class="stack" data-action="prefsSubmit">
      ${prefsFields(p)}
      ${navRow('Continue', true)}</form>`;
}
function vAvailability() {
  const co = ui.mode === 'coordinator';
  if (F.avail === 'recurring' && !PUI.ruleDraft) PUI.ruleDraft = blankRule(F);
  if (F.avail === 'once' && !PUI.dateDraft) PUI.dateDraft = blankDate(F);
  return `<h2>${co ? 'Proposed availability' : 'When can students come?'}</h2><p class="fine">${co ? 'The physician confirms this with their participation. It can be changed any time.' : 'You can finish without dates and add them from your portal when you are ready.'}</p>
    <form class="stack" data-action="availSubmit">
      <div class="seg"><button type="button" data-action="avail" data-avail="recurring" class="${F.avail === 'recurring' ? 'on' : ''}">Recurring availability</button><button type="button" data-action="avail" data-avail="once" class="${F.avail === 'once' ? 'on' : ''}">A one-time date</button><button type="button" data-action="avail" data-avail="later" class="${F.avail === 'later' ? 'on' : ''}">${co ? 'Leave it to the physician' : "I'll add availability later"}</button></div>
      ${F.avail === 'recurring' ? `<div class="form">${ruleFields(PUI.ruleDraft, F)}</div>` : F.avail === 'once' ? `<div class="form">${dateFields(PUI.dateDraft, F)}</div>` : `<p class="fine">${co ? 'The physician will be asked for availability after confirming.' : 'Students cannot see you until you add at least one date, and nothing is booked without your availability.'}</p>`}
      ${navRow(co ? 'Send to the physician' : 'Finish')}</form>`;
}
function vCoVerify() {
  const c = F.co;
  if (ui.vcodeSent) return `<h2>Verify your email</h2>${codeForm(false, c.email)}`;
  return `<h2>Your coordinator account</h2><p class="fine">A free Keivos sign-in for office staff. From it you manage scheduling for the physicians who authorize you: availability, confirmations, attendance and cancellations at their locations.</p>
    <form class="stack" data-action="coEmailSubmit"><div class="form">
      <div class="field"><label for="c-first">First name</label><input id="c-first" data-co="first" value="${esc(c.first)}" required></div>
      <div class="field"><label for="c-last">Last name</label><input id="c-last" data-co="last" value="${esc(c.last)}" required></div>
      <div class="field full"><label for="c-email">Your work email</label><input id="c-email" type="email" data-co="email" value="${esc(c.email)}" placeholder="office@practice.com" required></div>
    </div><p class="fine">Already have a coordinator account? Enter its email and sign in with the code.</p>${navRow('Send code')}</form>`;
}
function vCoord() {
  const c = F.co;
  return `<h2>The physician</h2><p class="fine">We email the physician to confirm. If they already have a Keivos profile they are asked to authorize you for this location; if not, they confirm the profile you prepare. Nothing is visible to students until they answer.</p>
    <form class="stack" data-action="coordSubmit"><div class="form">
      <div class="field"><label for="c-pfirst">Physician's first name</label><input id="c-pfirst" data-co="physFirst" value="${esc(c.physFirst)}" required></div>
      <div class="field"><label for="c-plast">Last name</label><input id="c-plast" data-co="physLast" value="${esc(c.physLast)}" required></div>
      <div class="field"><label for="c-pemail">Professional email${info('The confirmation goes here and the physician must answer it personally. We never say whether an email already has a profile.')}</label><input id="c-pemail" type="email" data-co="physEmail" value="${esc(c.physEmail)}" placeholder="dr.kim@practice.com" required></div>
      <div class="field"><label for="f-specialty">Specialty</label>${sel('specialty', [['', 'Choose…'], ...SPECIALTIES, ['other', 'Other']])}</div>
      ${F.specialty === 'other' ? `<div class="field"><label for="f-specOther">Specialty</label>${inp('specOther', 'placeholder="Addiction Medicine" required')}</div>` : ''}
    </div>${navRow()}</form>`;
}
function vDone() {
  const k = ui.done; const physName = (F.co.physFirst + ' ' + F.co.physLast).trim();
  if (k === 'coordinator') return `<section class="card stack onboard" style="max-width:640px"><h2>Sent to ${esc(physName ? 'Dr. ' + F.co.physLast : 'the physician')}</h2><p>We emailed <b>${esc(F.co.physEmail)}</b>. If they already have a Keivos profile, they are asked to authorize you as scheduling coordinator at ${esc((F.locations[0] || {}).name || 'this location')}; if not, they confirm the profile you prepared. ${esc(CFG.org)} then reviews the connection.</p><p class="fine">Nothing is visible to students until the physician answers. When they do, the location appears in your coordinator portal and you'll receive its scheduling emails.</p><div class="row"><button class="btn primary" data-action="toast" data-msg="Opens the coordinator portal.">Open my coordinator portal</button><button class="btn" data-action="restart">Done</button></div></section>`;
  const incomplete = setupIncomplete(F) || F.avail === 'later';
  if (k === 'independent') return `<section class="card stack onboard" style="max-width:640px"><h2>Your profile is ready, ${esc(F.display || F.first || 'Doctor')}.</h2><p>It is not visible to any students yet. When a pre-med organization invites you, open their link and choose "Use my existing profile". You can also recommend Keivos to an organization you already work with from your portal.</p>${setupIncomplete(F) ? setupChecklist(F, false) : ''}<div class="row"><button class="btn primary" data-action="toast" data-msg="Opens the physician portal.">Open my portal</button><button class="btn" data-action="restart">Done</button></div></section>`;
  const named = k === 'existing' ? existing().name : fullName(F);
  return `<section class="card stack onboard" style="max-width:640px"><h2>You're connected to ${esc(CFG.org)}.</h2><p>Their administrators review new physicians; we'll email you when students can see you.${incomplete ? '' : ' Your availability is set and will show once they approve.'}</p>
    ${setupIncomplete(F) ? setupChecklist(F, false) : F.avail === 'later' ? '<div class="notice">Your profile is saved. Add availability from your portal whenever you are ready; students cannot book without it.</div>' : ''}
    <dl class="kv"><dt>Profile</dt><dd>${esc(named)}</dd><dt>Emails you'll get</dt><dd>Booking requests and confirmations, visit reminders ${F.prefs.reminderDays ? F.prefs.reminderDays + ' day' + (F.prefs.reminderDays > 1 ? 's' : '') + ' before' : '(off)'}, one attendance question after each visit${F.prefs.summary && F.prefs.summary !== 'off' ? ', a ' + summaryText(F.prefs) + ' summary when there is something to report' : ''}${F.prefs.renewalReminders ? ', and a renewal reminder before each term' : ''}.</dd></dl>
    <div class="row"><button class="btn primary" data-action="toast" data-msg="Opens the physician portal.">Open my portal</button><button class="btn" data-action="restart">Done</button></div></section>`;
}
function vIntake() {
  if (ui.done) return vDone();
  if (ui.mode === 'landing') return vLanding();
  const body = ({ verify: vVerify, profile: vProfileStep, connect: vConnect, shadow: vShadow, location: vLocation, prefs: vPrefs, availability: vAvailability, coverify: vCoVerify, coord: vCoord })[ui.step]();
  return `<section class="card stack onboard" style="max-width:860px">${steps()}${body}</section>`;
}
function render() { document.getElementById('signed').textContent = ui.invited ? CFG.org : ''; document.getElementById('app').innerHTML = vIntake(); }
document.getElementById('app').addEventListener('click', e => {
  if (e.target.closest('.info')) return;
  const el = e.target.closest('[data-action]'); if (!el) return;
  if (el.tagName === 'INPUT' || el.tagName === 'FORM' || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA') return;
  const a = el.dataset.action;
  if (a === 'mode') { ui.mode = el.dataset.mode; ui.step = FLOWS[ui.mode][0]; ui.vcodeSent = false; ui.dupe = false; if (ui.mode === 'existing') F.email = existing().email; }
  else if (a === 'noInvite') { ui.invited = false; F.orgs = []; }
  else if (a === 'back') { if ((ui.step === 'verify' || ui.step === 'coverify') && ui.vcodeSent) ui.vcodeSent = false; else back(); }
  else if (a === 'changeEmail') ui.vcodeSent = false;
  else if (a === 'useExisting') { ui.mode = 'existing'; ui.step = 'verify'; ui.dupe = false; }
  else if (a === 'avail') { F.avail = el.dataset.avail; }
  else if (a === 'skip') { const k = el.dataset.step; F.skipped[k] = true; if (k === 'shadow' && F.orgs[0]) F.orgs[0].prefsSet = false; if (k === 'location') PUI.locDraft = null; if (k === 'availability') F.avail = 'later'; next(); if (ui.done) toast('Saved. Finish the rest from your portal when you are ready.'); }
  else if (a === 'restart') { ui.done = ''; ui.mode = 'landing'; ui.step = 'verify'; PUI.locDraft = null; PUI.ruleDraft = null; PUI.dateDraft = null; F.skipped = {}; }
  else if (a === 'toast') { toast(el.dataset.msg); return; }
  else if (!profileClick(a, el, F, 'Onboarding')) return;
  render();
});
document.getElementById('app').addEventListener('input', e => { const el = e.target; if (el.dataset.f) F[el.dataset.f] = el.value; if (el.dataset.co) F.co[el.dataset.co] = el.value; });
document.getElementById('app').addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.f) { F[el.dataset.f] = el.value; if (el.dataset.f === 'specialty') render(); return; }
  if (el.dataset.co) { F.co[el.dataset.co] = el.value; return; }
  if (el.id === 'agree') { F.agree = el.checked; return; }
  const r = profileChange(el, F, 'Onboarding'); if (r === 'render') render();
});
document.getElementById('app').addEventListener('submit', e => {
  e.preventDefault(); const a = e.target.dataset.action; const v = i => { const x = document.getElementById(i); return x ? x.value.trim() : ''; };
  if (a === 'emailSubmit') { F.email = v('f-email'); if (ui.mode !== 'existing' && F.email.toLowerCase() === existing().email) { ui.dupe = true; render(); return; } ui.dupe = false; ui.vcodeSent = true; ui.vcode = ''; ui.vcodeError = false; render(); toast('Code sent to ' + F.email + '.'); return; }
  if (a === 'coEmailSubmit') { F.co.first = v('c-first'); F.co.last = v('c-last'); F.co.email = v('c-email'); if (!F.co.email) return; ui.vcodeSent = true; ui.vcode = ''; ui.vcodeError = false; render(); toast('Code sent to ' + F.co.email + '.'); return; }
  if (a === 'codeSubmit') { const code = v('vcode').replace(/\s+/g, ''); ui.vcode = v('vcode'); if (!/^\d{6}$/.test(code)) { ui.vcodeError = true; render(); return; } ui.vcodeError = false; ui.vcodeSent = false; next(); render(); toast(ui.mode === 'existing' ? 'Signed in.' : 'Email verified.'); return; }
  if (a === 'profileSubmit') { F.first = v('nf-first') || F.first; F.last = v('nf-last') || F.last; if (!F.first || !F.last) { toast('Enter your first and last name.'); return; } const o = F.specialty === 'other' ? F.specOther.trim() : ''; if (o && !SPECIALTIES.includes(o)) { SPECIALTIES.push(o); SPECIALTIES.sort((x, y) => x.localeCompare(y)); F.specialty = o; } if (!F.specialty) { toast('Choose your specialty.'); return; } syncName(F); next(); render(); return; }
  if (a === 'connectSubmit') { if (!F.agree) { toast('Tick the box to connect.'); return; } next(); render(); return; }
  if (a === 'shadowSubmit') { if (F.orgs[0]) F.orgs[0].prefsSet = true; next(); render(); if (ui.done) toast('Connected. ' + CFG.org + ' will review your profile.'); return; }
  if (a === 'locationSubmit') { const l = PUI.locDraft; if (!l.name.trim()) { toast('Give the location a name.'); return; } l.id = l.id || nid('loc'); l.isDefault = true; F.locations = [l]; if (l.coordEmail) { inviteCoordinator(F, l.id, l.coordName, l.coordEmail, !!l.coordApprove, 'Onboarding'); } PUI.locDraft = null; next(); render(); return; }
  if (a === 'prefsSubmit') { next(); render(); return; }
  if (a === 'coordSubmit') { F.co.physFirst = v('c-pfirst'); F.co.physLast = v('c-plast'); F.co.physEmail = v('c-pemail'); if (!F.co.physEmail) return; F.first = F.co.physFirst; F.last = F.co.physLast; syncName(F); next(); render(); return; }
  if (a === 'availSubmit') { if (F.avail === 'recurring') { const r = PUI.ruleDraft; F.rules = [{ ...r, id: nid('r'), locationId: loc(F).id }]; } else if (F.avail === 'once') { const m = PUI.dateDraft; F.manual = [{ ...m, id: nid('m'), locationId: loc(F).id }]; } next(); render(); if (ui.done && (F.skipped.location || F.skipped.shadow)) toast('Saved. Finish the rest from your portal when you are ready.'); return; }
});
render();
</script>

</body></html>
